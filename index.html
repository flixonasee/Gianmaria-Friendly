<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gianmaria-Friendly Finder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Breadcrumb Header -->
    <header id="breadcrumb-header" style="display: none;">
      <button id="ricomincia-button" class="breadcrumb-back-button" onclick="goBack()">&lt;</button>
      <span id="breadcrumb-title" class="breadcrumb-title">Home</span>

    <!-- Main App Content -->
    <main id="content">
      <header id="landing-header">
        <!-- Logo -->
        <div class="logo">

        </div>
        <!-- Cover Image -->
        <div class="cover-img">
          <img src="https://github.com/flixonasee/gfriendly/blob/052e2db5076ce2a1a0c44093f07fc908e1f3d5fb/lol.gif?raw=true" alt="Cover Image">
        </div>
        <!-- Start Button -->
        <button id="start-button" class="category-button">Inizia</button>
      </header>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
